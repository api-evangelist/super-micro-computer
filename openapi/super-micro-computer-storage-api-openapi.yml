openapi: 3.0.3
info:
  title: Supermicro Redfish Accounts Storage API
  description: Supermicro's implementation of the DMTF Redfish RESTful API standard for out-of-band server management via BMC (Baseboard Management Controller). Provides programmatic access to server health monitoring, power management, BIOS/BMC firmware updates, storage configuration, network configuration, user account management, and event logging across Supermicro server platforms (X10 and later Intel-based, H11 and later AMD-based platforms).
  version: '1.0'
  contact:
    name: Supermicro Support
    url: https://www.supermicro.com/en/support
    email: support@supermicro.com
  license:
    name: Proprietary
    url: https://www.supermicro.com/en/solutions/management-software/redfish
servers:
- url: https://{bmc-ip}/redfish/v1
  description: Supermicro BMC Redfish endpoint
  variables:
    bmc-ip:
      description: IP address or hostname of the BMC
      default: 192.168.1.100
security:
- BasicAuth: []
- SessionAuth: []
tags:
- name: Storage
  description: Storage controller and drive management
paths:
  /Systems/{systemId}/Storage:
    get:
      operationId: listStorage
      summary: List Storage Controllers
      description: Returns the collection of storage controllers in the computer system.
      tags:
      - Storage
      parameters:
      - name: systemId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Collection of storage controllers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
  /Systems/{systemId}/Storage/{storageId}:
    get:
      operationId: getStorageController
      summary: Get Storage Controller
      description: Returns detailed information about a specific storage controller.
      tags:
      - Storage
      parameters:
      - name: systemId
        in: path
        required: true
        schema:
          type: string
      - name: storageId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Storage controller resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Storage'
components:
  schemas:
    Status:
      type: object
      description: Health and operational status
      properties:
        State:
          type: string
          enum:
          - Enabled
          - Disabled
          - StandbyOffline
          - StandbySpare
          - InTest
          - Starting
          - Absent
          - UnavailableOffline
          - Deferring
          - Quiescing
          - Updating
        Health:
          type: string
          enum:
          - OK
          - Warning
          - Critical
        HealthRollup:
          type: string
          enum:
          - OK
          - Warning
          - Critical
    ODataId:
      type: object
      properties:
        '@odata.id':
          type: string
          description: OData link to the resource
    Storage:
      type: object
      description: A storage controller and its drives
      properties:
        '@odata.type':
          type: string
        Id:
          type: string
        Name:
          type: string
        Status:
          $ref: '#/components/schemas/Status'
        StorageControllers:
          type: array
          items:
            type: object
            properties:
              Name:
                type: string
              Manufacturer:
                type: string
              Model:
                type: string
              FirmwareVersion:
                type: string
              Status:
                $ref: '#/components/schemas/Status'
        Drives:
          type: array
          items:
            $ref: '#/components/schemas/ODataId'
    Collection:
      type: object
      description: A collection of resources with navigation links
      properties:
        '@odata.type':
          type: string
        Name:
          type: string
        Members@odata.count:
          type: integer
        Members:
          type: array
          items:
            $ref: '#/components/schemas/ODataId'
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using BMC username and password
    SessionAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Redfish session token obtained from POST /redfish/v1/SessionService/Sessions
