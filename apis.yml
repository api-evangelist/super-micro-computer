name: Super Micro Computer
description: >-
  Super Micro Computer (Supermicro) is a global leader in high-performance, high-efficiency server technology and
  innovation, providing complete server, storage, and networking solutions for data center, cloud, AI, and edge
  applications. Supermicro exposes its server management capabilities through the DMTF Redfish RESTful API standard,
  enabling programmatic management of servers, storage, and networking hardware via BMC.
