naftiko: 1.0.0-alpha2
info:
  label: Supermicro Redfish API — Sessions
  description: 'Supermicro Redfish API — Sessions. 4 operations. Lead operation: List Sessions. Self-contained Naftiko capability
    covering one Super Micro Computer business surface.'
  tags:
  - Super Micro Computer
  - Sessions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SUPER_MICRO_COMPUTER_API_KEY: SUPER_MICRO_COMPUTER_API_KEY
capability:
  consumes:
  - type: http
    namespace: supermicro-redfish-sessions
    baseUri: https://{bmc-ip}/redfish/v1
    description: Supermicro Redfish API — Sessions business capability. Self-contained, no shared references.
    resources:
    - name: SessionService-Sessions
      path: /SessionService/Sessions
      operations:
      - name: listsessions
        method: GET
        description: List Sessions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createsession
        method: POST
        description: Create Session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: SessionService-Sessions-sessionId
      path: /SessionService/Sessions/{sessionId}
      operations:
      - name: getsession
        method: GET
        description: Get Session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sessionId
          in: path
          type: string
          required: true
      - name: deletesession
        method: DELETE
        description: Delete Session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sessionId
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: X-Auth-Token
      value: '{{env.SUPER_MICRO_COMPUTER_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: supermicro-redfish-sessions-rest
    port: 8080
    description: REST adapter for Supermicro Redfish API — Sessions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/sessionservice/sessions
      name: sessionservice-sessions
      description: REST surface for SessionService-Sessions.
      operations:
      - method: GET
        name: listsessions
        description: List Sessions
        call: supermicro-redfish-sessions.listsessions
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createsession
        description: Create Session
        call: supermicro-redfish-sessions.createsession
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sessionservice/sessions/{sessionid}
      name: sessionservice-sessions-sessionid
      description: REST surface for SessionService-Sessions-sessionId.
      operations:
      - method: GET
        name: getsession
        description: Get Session
        call: supermicro-redfish-sessions.getsession
        with:
          sessionId: rest.sessionId
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletesession
        description: Delete Session
        call: supermicro-redfish-sessions.deletesession
        with:
          sessionId: rest.sessionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: supermicro-redfish-sessions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Supermicro Redfish API — Sessions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-sessions
      description: List Sessions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: supermicro-redfish-sessions.listsessions
      outputParameters:
      - type: object
        mapping: $.
    - name: create-session
      description: Create Session
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: supermicro-redfish-sessions.createsession
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-session
      description: Get Session
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: supermicro-redfish-sessions.getsession
      with:
        sessionId: tools.sessionId
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-session
      description: Delete Session
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: supermicro-redfish-sessions.deletesession
      with:
        sessionId: tools.sessionId
      outputParameters:
      - type: object
        mapping: $.
