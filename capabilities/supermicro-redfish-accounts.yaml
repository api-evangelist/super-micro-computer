    port: 9090
    transport: http
    description: MCP adapter for Supermicro Redfish API — Accounts. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-accounts
      description: List Accounts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: supermicro-redfish-accounts.listaccounts
      outputParameters:
      - type: object
        mapping: $.
    - name: create-account
      description: Create Account
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: supermicro-redfish-accounts.createaccount
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-account
      description: Get Account
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: supermicro-redfish-accounts.getaccount
      with:
        accountId: tools.accountId
      outputParameters:
      - type: object
        mapping: $.
    - name: update-account
      description: Update Account
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: supermicro-redfish-accounts.updateaccount
      with:
        accountId: tools.accountId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-account
      description: Delete Account
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: supermicro-redfish-accounts.deleteaccount
      with:
        accountId: tools.accountId
      outputParameters:
      - type: object
        mapping: $.
