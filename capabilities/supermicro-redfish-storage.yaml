naftiko: 1.0.0-alpha2
info:
  label: Supermicro Redfish API — Storage
  description: 'Supermicro Redfish API — Storage. 2 operations. Lead operation: List Storage Controllers. Self-contained Naftiko
    capability covering one Super Micro Computer business surface.'
  tags:
  - Super Micro Computer
  - Storage
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SUPER_MICRO_COMPUTER_API_KEY: SUPER_MICRO_COMPUTER_API_KEY
capability:
  consumes:
  - type: http
    namespace: supermicro-redfish-storage
    baseUri: https://{bmc-ip}/redfish/v1
    description: Supermicro Redfish API — Storage business capability. Self-contained, no shared references.
    resources:
    - name: Systems-systemId-Storage
      path: /Systems/{systemId}/Storage
      operations:
      - name: liststorage
        method: GET
        description: List Storage Controllers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: systemId
          in: path
          type: string
          required: true
    - name: Systems-systemId-Storage-storageId
      path: /Systems/{systemId}/Storage/{storageId}
      operations:
      - name: getstoragecontroller
        method: GET
        description: Get Storage Controller
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: systemId
          in: path
          type: string
          required: true
        - name: storageId
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: X-Auth-Token
      value: '{{env.SUPER_MICRO_COMPUTER_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: supermicro-redfish-storage-rest
    port: 8080
    description: REST adapter for Supermicro Redfish API — Storage. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/systems/{systemid}/storage
      name: systems-systemid-storage
      description: REST surface for Systems-systemId-Storage.
      operations:
      - method: GET
        name: liststorage
        description: List Storage Controllers
        call: supermicro-redfish-storage.liststorage
        with:
          systemId: rest.systemId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/systems/{systemid}/storage/{storageid}
      name: systems-systemid-storage-storageid
      description: REST surface for Systems-systemId-Storage-storageId.
      operations:
      - method: GET
        name: getstoragecontroller
        description: Get Storage Controller
        call: supermicro-redfish-storage.getstoragecontroller
        with:
          systemId: rest.systemId
          storageId: rest.storageId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: supermicro-redfish-storage-mcp
    port: 9090
    transport: http
    description: MCP adapter for Supermicro Redfish API — Storage. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-storage-controllers
      description: List Storage Controllers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: supermicro-redfish-storage.liststorage
      with:
        systemId: tools.systemId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-storage-controller
      description: Get Storage Controller
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: supermicro-redfish-storage.getstoragecontroller
      with:
        systemId: tools.systemId
        storageId: tools.storageId
      outputParameters:
      - type: object
        mapping: $.
